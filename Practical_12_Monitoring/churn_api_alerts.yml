groups:
  - name: churn-api-alerts
    rules:
      - alert: ChurnAPIClientErrors
        expr: sum(rate(churn_api_http_requests_total{status=~"4.."}[2m])) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Churn API is receiving client errors"
          description: "4xx responses have been observed during the recent window."

      - alert: ChurnAPIDown
        expr: up{job="churn-prediction-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Churn API monitoring target is down"
          description: "Prometheus cannot scrape the deployed API."
